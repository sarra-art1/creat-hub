users(){const us=S.users.map((u,i)=>[u,i]).filter(x=>x[0].role!=='admin').sort((a,b)=>(stt(b[0])==='pending')-(stt(a[0])==='pending'));return us.length?`<div class="sc"><table class="tbl"><tr><th>Nom</th><th>Rôle</th><th>E-mail</th><th>Statut</th><th>Actions</th></tr>${us.map(([u,i])=>`<tr><td><b>${esc(u.n)}</b><br><small class="muted">@${esc(u.u||'')}</small></td><td>${u.role==='artist'?'Artiste':'Client'}</td><td>${esc(u.e)}</td><td>${stag(stt(u))}</td><td class="row wrap"><button class="btn sm2" onclick="userD(${i})">Détails</button><button class="btn sm2" onclick="userE(${i})">Modifier</button>${stt(u)==='pending'?`<button class="btn sm2 pri" onclick="setSt(${i},'active')">Approuver</button><button class="btn sm2" onclick="setSt(${i},'rejected')">Refuser</button>`:`<button class="btn sm2" onclick="setSt(${i},'${stt(u)==='active'?'suspended':'active'}')">${stt(u)==='active'?'Suspendre':'Activer'}</button>`}<button class="btn sm2" onclick="delU(${i})">Supprimer</button></td></tr>`).join('')}</table></div>`:'<p class="muted">Aucun utilisateur inscrit pour le moment. Les comptes créés via l’inscription apparaissent ici.</p>'},
arts(){const A=ALLX();return`<div class="row wrap" style="margin-bottom:12px"><button class="btn pri" onclick="artForm('',true)">+ Ajouter une œuvre</button><span class="muted">Les ${ART.length} œuvres de démonstration peuvent être modifiées ou masquées.</span></div><div class="sc"><table class="tbl"><tr><th></th><th>Œuvre</th><th>Artiste</th><th>Prix</th><th>Stock</th><th>Statut</th><th>Actions</th></tr>${A.map(a=>`<tr><td style="width:56px"><div style="width:48px;height:48px;border-radius:8px;overflow:hidden">${vis(a)}</div></td><td>${esc(a.t)}<br><small class="muted">${esc(cn(a.c))}</small></td><td>${esc(an(a))}</td><td>${a.p} DT</td><td>${a.qty}</td><td>${stag(a.st||'approved')} ${a.av==='off'?'<span class="tg no">Indisponible</span>':''}</td><td class="row wrap"><button class="btn sm2" onclick="artForm('${a.id}',true)">Modifier</button>${a.st==='pending'?`<button class="btn sm2 pri" onclick="setArtSt('${a.id}','approved')">Accepter</button><button class="btn sm2" onclick="setArtSt('${a.id}','rejected')">Refuser</button>`:''}<button class="btn sm2" onclick="togAv('${a.id}')">${a.av==='off'?'Rendre disponible':'Rendre indisponible'}</button><button class="btn sm2" onclick="delArt('${a.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`},
orders(){return S.orders.length?`<div class="sc"><table class="tbl"><tr><th>ID</th><th>Client</th><th>Œuvres / artistes</th><th>Total</th><th>Date</th><th>Paiement</th><th>Livraison</th></tr>${S.orders.map((o,i)=>`<tr><td>${o.id}</td><td>${esc(o.buyer)}<br><small class="muted">${esc(o.city||'')}</small></td><td>${o.items.map(x=>esc(x.t)+' <small class="muted">('+esc(x.by)+')</small>').join('<br>')}</td><td>${o.total} DT</td><td>${new Date(o.t).toLocaleDateString('fr-FR')}</td><td><select onchange="setO(${i},'pay',this.value)">${Object.entries(PL).map(([k,v])=>`<option value="${k}" ${o.pay===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select onchange="setO(${i},'del',this.value)">${Object.entries(DL).map(([k,v])=>`<option value="${k}" ${o.del===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<p class="muted">Aucune commande pour le moment.</p>'},
cmp(){return S.cmp.length?`<div class="sc"><table class="tbl"><tr><th>Date</th><th>Type</th><th>De</th><th>Message</th><th>Statut</th><th>Actions</th></tr>${S.cmp.map((c,i)=>`<tr><td>${fmtD(c.t)}</td><td>${c.type}</td><td>${esc(c.name)}<br><small class="muted">${esc(c.e)}</small></td><td>${esc(c.msg)}</td><td>${stag(c.st==='open'?'pending':'accepted').replace(/En attente|Acceptée/,c.st==='open'?'Ouverte':'Traitée')}</td><td class="row wrap"><button class="btn sm2" onclick="S.cmp[${i}].st='${c.st==='open'?'done':'open'}';LG('Admin : réclamation mise à jour');save();adminM()">${c.st==='open'?'Marquer traitée':'Rouvrir'}</button><button class="btn sm2" onclick="S.cmp.splice(${i},1);save();adminM()">Supprimer</button></td></tr>`).join('')}</table></div>`:'<p class="muted">Aucune réclamation ni message pour le moment.</p>'}});
function setSt(i,s){if(noU())return;const u=S.users[i];u.st=s;LG('Admin : compte '+u.n+' → '+({active:'activé',suspended:'suspendu',rejected:'refusé'}[s]));save();adminM();ars()}
function setArtSt(id,s){if(noU())return;const m=S.mine.find(x=>x.id===id);if(m){m.st=s;LG('Admin : œuvre « '+m.t+' » → '+(s==='approved'?'acceptée':'refusée'));save();rfr()}}
function togAv(id){if(noU())return;const a=ALLX().find(x=>x.id===id),m=S.mine.find(x=>x.id===id),v=a.av==='off'?'on':'off';if(m)m.av=v;else S.ov[id]=Object.assign(S.ov[id]||{},{av:v});LG('Admin : disponibilité « '+a.t+' » → '+v);save();rfr()}
function setO(i,k,v){if(noU())return;S.orders[i][k]=v;LG('Admin : commande '+S.orders[i].id+' ('+k==='pay'?'paiement':'livraison'+') → '+v);save();toast('Statut mis à jour');adminM()}
function userE(i){const u=S.users[i];modal(`<h3 style="font-size:28px">Modifier ${esc(u.n)}</h3><form onsubmit="event.preventDefault();userS(this,${i})">${fld('ph','Téléphone',`value="${esc(u.ph||'')}"`)}${fld('lc','Localisation',`value="${esc(u.loc||u.city||'')}"`)}${u.role==='artist'?fta('bio','Biographie',3,u.bio):''}<button class="btn pri">Enregistrer</button> <button type="button" class="btn" onclick="closeM()">Annuler</button></form>`)}
function userS(f,i){const u=S.users[i];u.ph=f.ph.value.trim();u.loc=f.lc.value.trim();if(f.bio)u.bio=f.bio.value.trim();LG('Admin : profil modifié : '+u.n);save();closeM();adminM();ars()}

shell();
</script></body></html>
