<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administration – CreatHub</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="creathub-pages.css"></head><body>
<header class="top"><a class="logo" href="shop.html">Creat<b>Hub</b></a><nav><a href="shop.html">Boutique</a><span id="authLinks" class="row"></span></nav></header><main><h1>Administration</h1><div id="gate" class="card"><p>Vérification de l’accès…</p></div>
<div id="app" hidden>
<section><h2>Gestion des commandes</h2><div class="row"><label style="margin:0">Statut <select id="fs"><option value="">Tous les statuts</option><option value="new">Nouvelle</option><option value="preparing">En préparation</option><option value="done">Terminée</option><option value="cancelled">Annulée</option></select></label><button id="rf" class="alt">Actualiser</button></div><p id="om" class="msg" role="status"></p><div id="ol"></div><button id="more" class="alt" hidden>Charger la suite</button></section>
<section style="margin-top:38px"><h2>Produits</h2><form id="pf" class="card" novalidate><h3 id="pt">Ajouter un produit</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><label>Identifiant (minuscules, chiffres, tirets)<input name="id" maxlength="60"></label><label>Nom<input name="name" maxlength="120"></label><label>Catégorie<select name="category"></select></label><label>Prix (DT)<input name="price" inputmode="decimal" placeholder="12,50"></label><label>Image (HTTPS ou fichier du site)<input name="image" placeholder="images/vase.jpg"></label></div><label>Description<textarea name="description" rows="3" maxlength="3000"></textarea></label><label>Caractéristiques (une par ligne)<textarea name="features" rows="3"></textarea></label><label class="row"><input type="checkbox" name="available" checked style="width:auto;margin:0"> Visible dans la boutique</label><p id="pm" class="msg" role="status"></p><div class="row"><button id="ps">Enregistrer</button><button type="button" id="pn" class="alt">Nouveau produit</button></div></form><div class="scroll"><table id="pl" style="margin-top:18px"></table></div></section></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="supabase-client.js"></script><script defer src="supabase-shop.js"></script><script defer src="header.js"></script><script>document.addEventListener("DOMContentLoaded",function(){
var $=function(i){return document.getElementById(i)},esc=CH.esc,O=[],P=[],editing=null;
(async function(){var g=$('gate');
if(!window.CH||!CH.sb){g.innerHTML='<p class="msg err">Supabase n’est pas configuré (voir SUPABASE.md).</p>';return}
var u=await CH.auth.user();if(!u){g.innerHTML='<p>Cette page est réservée à l’administrateur. <a href="login.html?next=admin.html">Se connecter</a></p>';return}
if(!(await CH.auth.isAdmin(u))){g.innerHTML='<p><b>Accès refusé.</b> Votre compte est un compte client : seule une personne ayant le rôle administrateur peut ouvrir cette page.</p><a class="btn alt" href="shop.html">Retour à la boutique</a>';return}
g.hidden=true;$('app').hidden=false;$('pf').category.innerHTML=Object.keys(CH.CATEGORIES).map(function(c){return '<option value="'+c+'">'+esc(CH.CATEGORIES[c])+'</option>'}).join('');loadOrders(true);loadProducts()})();
function row(o){var opts=Object.keys(CH.STATUS).map(function(s){return '<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+CH.STATUS[s]+'</option>'}).join('');
return '<details data-oid="'+o.id+'"><summary>'+esc(o.reference)+' · '+new Date(o.created_at).toLocaleString('fr-FR')+' · '+esc(o.customer_name)+' · '+CH.money(o.total_cents)+' · <span class="tag">'+esc(CH.STATUS[o.status])+'</span></summary><div class="scroll"><table><tr><th>Produit</th><th>Qté</th><th>Prix unitaire</th><th>Total</th></tr>'+o.items.map(function(i){return '<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+CH.money(i.price_cents)+'</td><td>'+CH.money(i.line_cents)+'</td></tr>'}).join('')+'</table></div><p>Sous-total : '+CH.money(o.subtotal_cents)+' · Livraison : '+CH.money(o.shipping_cents)+' · <b>Total : '+CH.money(o.total_cents)+'</b><br>Client : '+esc(o.customer_name)+' · '+esc(o.phone)+'<br>Livraison : '+esc(o.address)+', '+esc(o.city)+'<br>Paiement : '+esc(CH.PAYMENT[o.payment_method]||o.payment_method)+'</p><div class="row"><select data-st="'+o.id+'">'+opts+'</select><button data-save="'+o.id+'">Enregistrer le statut</button></div></details>'}
async function loadOrders(reset){var m=$('om');m.className='msg';m.textContent='Chargement…';$('rf').disabled=true;try{var r=await CH.admin.orders({status:$('fs').value,beforeId:reset?null:O[O.length-1].id});O=reset?r:O.concat(r);$('ol').innerHTML=O.length?O.map(row).join(''):'<p class="muted">Aucune commande pour ce filtre.</p>';$('more').hidden=r.length<50;m.textContent=''}catch(e){m.className='msg err';m.textContent=CH.friendly(e)}$('rf').disabled=false}
$('rf').onclick=function(){loadOrders(true)};$('fs').onchange=function(){loadOrders(true)};$('more').onclick=function(){loadOrders(false)};
$('ol').addEventListener('click',async function(e){var id=e.target.dataset.save;if(!id)return;var o=O.find(function(x){return String(x.id)===id}),sel=document.querySelector('select[data-st="'+id+'"]'),m=$('om');e.target.disabled=true;
try{var n=await CH.admin.setStatus(o.id,sel.value,o.updated_at);Object.assign(o,n);var el=document.querySelector('details[data-oid="'+id+'"]'),open=el.open;el.outerHTML=row(o);if(open)document.querySelector('details[data-oid="'+id+'"]').open=true;m.className='msg ok';m.textContent='Statut de '+o.reference+' enregistré.'}
catch(x){m.className='msg err';if(x.conflict){m.textContent='Cette commande a été modifiée entre-temps. La liste est rechargée : vérifiez puis recommencez.';loadOrders(true)}else{m.textContent=CH.friendly(x);e.target.disabled=false}}});
async function loadProducts(){try{P=await CH.admin.products();$('pl').innerHTML='<tr><th>Produit</th><th>Prix</th><th>Visible</th><th></th></tr>'+(P.map(function(p){return '<tr><td>'+esc(p.name)+'<br><small class="muted">'+esc(p.id)+' · '+esc(CH.CATEGORIES[p.category]||p.category)+'</small></td><td>'+CH.money(p.price_cents)+'</td><td>'+(p.available?'Oui':'Non')+'</td><td class="row"><button class="alt" data-edit="'+esc(p.id)+'">Modifier</button><button class="alt" data-del="'+esc(p.id)+'">Supprimer</button></td></tr>'}).join('')||'<tr><td class="muted">Aucun produit.</td></tr>')}catch(e){$('pm').className='msg err';$('pm').textContent=CH.friendly(e)}}
function reset(){editing=null;$('pf').reset();$('pf').id.readOnly=false;$('pt').textContent='Ajouter un produit';$('pf').available.checked=true}
$('pn').onclick=reset;
$('pl').addEventListener('click',async function(e){var f=$('pf'),m=$('pm');if(e.target.dataset.edit){var p=P.find(function(x){return x.id===e.target.dataset.edit});editing=p.id;f.id.value=p.id;f.id.readOnly=true;f.name.value=p.name;f.category.value=p.category;f.price.value=(p.price_cents/100).toFixed(2).replace('.',',');f.image.value=p.image;f.description.value=p.description;f.features.value=(p.features||[]).join('\n');f.available.checked=p.available;$('pt').textContent='Modifier : '+p.name;f.scrollIntoView()}
if(e.target.dataset.del){var d=P.find(function(x){return x.id===e.target.dataset.del});if(!confirm('Supprimer définitivement « '+d.name+' » ? Les commandes déjà passées gardent son nom et son prix.'))return;e.target.disabled=true;try{await CH.admin.deleteProduct(d.id);m.className='msg ok';m.textContent='Produit supprimé.';if(editing===d.id)reset();loadProducts()}catch(x){m.className='msg err';m.textContent=CH.friendly(x);e.target.disabled=false}}});
$('pf').onsubmit=async function(e){e.preventDefault();var f=e.target,m=$('pm'),b=$('ps');m.className='msg err';var id=f.id.value.trim(),pr=f.price.value.trim().replace(',','.'),img=f.image.value.trim();
if(!/^[a-z0-9-]{2,60}$/.test(id))return m.textContent='Identifiant : 2 à 60 caractères (minuscules, chiffres, tirets).';
if(f.name.value.trim().length<2)return m.textContent='Nom trop court.';
if(!/^\d{1,7}(\.\d{1,2})?$/.test(pr)||parseFloat(pr)<=0)return m.textContent='Prix invalide (exemple : 12,50).';
if(img&&!/^(https:\/\/\S+|[A-Za-z0-9_.\/-]+)$/.test(img))return m.textContent='Image : URL HTTPS ou chemin de fichier du site.';
var p={id:id,name:f.name.value.trim(),category:f.category.value,description:f.description.value.trim(),price_cents:Math.round(parseFloat(pr)*100),image:img,features:f.features.value.split('\n').map(function(s){return s.trim()}).filter(Boolean),available:f.available.checked};
b.disabled=true;try{await CH.admin.saveProduct(p,!editing);m.className='msg ok';m.textContent=editing?'Produit modifié.':'Produit ajouté : il apparaît dans la boutique.';reset();loadProducts()}catch(x){m.className='msg err';m.textContent=/duplicate key/i.test(x.message||'')?'Cet identifiant existe déjà.':CH.friendly(x)}b.disabled=false}
});</script></body></html>
