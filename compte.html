<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mon compte – CreatHub</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="creathub-pages.css"></head><body>
<header class="top"><a class="logo" href="shop.html">Creat<b>Hub</b></a><nav><a href="shop.html">Boutique</a><span id="authLinks" class="row"></span></nav></header><main><h1>Mon compte</h1><div id="who" class="card"></div><h2 style="margin-top:28px">Mes commandes</h2><p class="muted">Les 100 dernières commandes sont affichées.</p><div id="list"><p>Chargement…</p></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="supabase-client.js"></script><script defer src="supabase-shop.js"></script><script defer src="header.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){
(async function(){var who=document.getElementById('who'),list=document.getElementById('list');
try{var u=await CH.auth.user();if(!u){location.href='login.html?next=compte.html';return}
var md=u.user_metadata||{};who.innerHTML='<b>'+CH.esc((md.first_name||'')+' '+(md.last_name||''))+'</b><br><span class="muted">'+CH.esc(u.email)+'</span>';
var o=await CH.orders.mine();list.innerHTML=o.length?o.map(function(x){return '<details><summary>'+CH.esc(x.reference)+' · '+new Date(x.created_at).toLocaleDateString('fr-FR')+' · '+CH.money(x.total_cents)+' · <span class="tag">'+CH.esc(CH.STATUS[x.status]||x.status)+'</span></summary><table><tr><th>Produit</th><th>Qté</th><th>Prix</th></tr>'+x.items.map(function(i){return '<tr><td>'+CH.esc(i.name)+'</td><td>'+i.qty+'</td><td>'+CH.money(i.line_cents)+'</td></tr>'}).join('')+'</table><p>Livraison : '+CH.money(x.shipping_cents)+' · '+CH.esc(CH.PAYMENT[x.payment_method]||'')+'<br>'+CH.esc(x.customer_name)+', '+CH.esc(x.address)+', '+CH.esc(x.city)+'</p></details>'}).join(''):'<p class="muted">Aucune commande pour le moment.</p>'}
catch(x){list.innerHTML='<p class="msg err">'+CH.esc(CH.friendly(x))+'</p>'}})();});</script></body></html>
