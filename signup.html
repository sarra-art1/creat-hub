<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inscription – CreatHub</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="creathub-pages.css"></head><body>
<header class="top"><a class="logo" href="shop.html">Creat<b>Hub</b></a><nav><a href="shop.html">Boutique</a><span id="authLinks" class="row"></span></nav></header><main class="narrow"><div class="card"><h1>Créer un compte</h1><form id="f" novalidate><label>Prénom<input name="first" autocomplete="given-name"></label><label>Nom<input name="last" autocomplete="family-name"></label><label>E-mail<input name="email" type="email" autocomplete="email"></label><label>Mot de passe (8 caractères minimum, un chiffre)<input name="password" type="password" autocomplete="new-password"></label><label>Confirmer le mot de passe<input name="confirm" type="password" autocomplete="new-password"></label><p id="m" class="msg" role="alert"></p><button id="b">S’inscrire</button></form><p class="muted">Déjà inscrit ? <a href="login.html">Connexion</a></p></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="supabase-client.js"></script><script defer src="supabase-shop.js"></script><script defer src="header.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){
var f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b'),next=new URLSearchParams(location.search).get('next')||'';
f.onsubmit=async function(e){e.preventDefault();m.className='msg err';var v=Object.fromEntries(new FormData(f));
if(v.first.trim().length<2||v.last.trim().length<2)return m.textContent='Saisissez votre prénom et votre nom.';
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email))return m.textContent='Adresse e-mail invalide.';
if(v.password.length<8||!/\d/.test(v.password))return m.textContent='Mot de passe : 8 caractères minimum, dont un chiffre.';
if(v.password!==v.confirm)return m.textContent='Les mots de passe ne correspondent pas.';
b.disabled=true;m.className='msg';m.textContent='Création du compte…';
try{var d=await CH.auth.signUp({first:v.first.trim(),last:v.last.trim(),email:v.email.trim(),password:v.password,next:next});
if(d.user&&d.user.identities&&!d.user.identities.length){m.className='msg err';m.textContent='Cette adresse e-mail est déjà utilisée.';b.disabled=false;return}
if(d.session){location.href=CH.safeNext(next);return}
location.href='verification.html?email='+encodeURIComponent(v.email.trim())+(next?'&next='+encodeURIComponent(next):'')}
catch(x){m.className='msg err';m.textContent=CH.friendly(x);b.disabled=false}};});</script></body></html>
